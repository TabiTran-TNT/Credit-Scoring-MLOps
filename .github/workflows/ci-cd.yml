name: Test, build and optionally publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the smoke-tested code image to GHCR (model supplied separately)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: 'true'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      EVIDENTLY_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m pytest tests -v --junitxml=reports/junit.xml --basetemp=work/pytest
      - name: Generate synthetic model only for the container smoke test
        run: python -m scripts.create_demo_artifacts --output work/ci-model
      - uses: actions/upload-artifact@v4
        with: {name: smoke-model, path: work/ci-model, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-report, path: reports/junit.xml}
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: smoke-model, path: work/ci-model}
      - name: Build code image once
        run: docker build -t credit-scoring:${{ github.sha }} .
      - name: Smoke-test the image with the test artifact
        shell: bash
        run: |
          docker run -d --name scoring -p 127.0.0.1:18000:8000 \
            -v "$PWD/work/ci-model:/workspace/model:ro" credit-scoring:${{ github.sha }}
          ready=false
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent -H 'Content-Type: application/json' \
            --data-binary @examples/request.json http://127.0.0.1:18000/predict
          curl --fail --silent http://127.0.0.1:18000/metrics
      - name: Publish exactly the tested image on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag credit-scoring:${GITHUB_SHA} "$image"
          docker push "$image"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs scoring || true
          docker rm -f scoring || true
